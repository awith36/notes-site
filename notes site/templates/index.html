<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <style>

        body {
    background-color: #181818;
}

.box {
  display: flex;
  justify-content: center; 
  align-items:center;
  height: 60vh;    
}

.box2 {
    border-color: white;
    border-style:solid;
    padding: 40px;
}

.flex-container {
    border: 2px;
    border-color: white;
}

.title {
    font-size:xxx-large;
    font-family: monospace;
}

button {
    background-color: green;
    color: black;          
    padding-left: 50px;
    padding-right: 50px;
    margin-left: 15px;
}
h1 {
    text-align: center;
    color: white;
}

p {
    color: white;
    text-align: left;
}

    </style>


</head>

<body>
<div class="title">
    <h1>Online Notes</h1>
</div>

<div class="box">
    <div class="box2">
        
            <h1>Login</h1>
            <p>Username:</p>
            <input type="text" id="username" name="username" placeholder="User" required>
            <br>
            <p>Password:</p>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <br>
            <div class="button">
            <br>
            <button onclick="submitForm()">ENTER</button>
            <br>
            <a href="/signup">or sign up</a>

    </div>

</div>
        
    </div>
</div>


    <script>

    // clear the form when page loads
    document.getElementById("username").reset;
    document.getElementById("password").reset;


        function submitForm() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;


            // post login
            fetch("/login", {
                method: 'POST',
                headers: {
                    'content-type': 'application/json'
                },
                body: JSON.stringify({
                username: user,
                password: pass
                })
            })
            .then(response => response.json())

            .then(access => {

                // allowed
                if (access.success === "allowed") {
                    console.log("allowed");
                    window.location.href = ("notes")
                }

                // denied
                else{
                    console.log("denied");
                    window.location.href = ("access-denied")
                }
            });


        }




</script>

</body>

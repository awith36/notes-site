<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <style>

        body {
    background-color: #181818;
}

.box {
  display: flex;
  justify-content: center; 
  align-items:center;
  height: 60vh;    
}

.box2 {
    border-color: white;
    border-style:solid;
    padding: 40px;
}

.flex-container {
    border: 2px;
    border-color: white;
}

.title {
    font-size:xxx-large;
    font-family: monospace;
}

button {
    background-color: green;
    color: black;          
    padding-left: 50px;
    padding-right: 50px;
    margin-left: 15px;
}
h1 {
    text-align: center;
    color: white;
}

p {
    color: white;
    text-align: left;
}

    </style>


</head>

<body>
<div class="title">
    <h1>Online Notes</h1>
</div>

<div class="box">
    <div class="box2">
        
            <h1>Sign Up</h1>
            <p>Username:</p>
            <input type="text" id="username" name="username" placeholder="User" required>
            <br>
            <p>Password:</p>
            <input type="password" id="password" name="password" placeholder="Confirm Password" required>
            <br>
            <p>Confirm Password:</p>
            <input type="password" id="password2" name="password" placeholder="Confirm Password" required>
            <br>
            <div class="button">
            <br>
            <button onclick="submitForm()">ENTER</button>

                    
    </div>

</div>
        
    </div>
</div>


<script>
    function submitForm(){
        if(document.getElementById("password").value == document.getElementById("password2").value) {
            
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            fetch("http://127.0.0.1/newUser", {
                method: 'POST',
                headers: {
                    'content-type': 'application/json'
                },
                body: JSON.stringify({"username": user, "password": pass})
            })
            .then(response => response.json())
            .then(status => {
            if (status.status == "saved")
                window.location.href = ("notes")
            });

        }
        else{
            console.log("passwords dont match");
            alert("passwords dont match");
        }


        
            
        
    }


</script>

</body>
